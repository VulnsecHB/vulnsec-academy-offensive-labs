[global]
   workgroup = NORTHLINE
   server string = Cutover public
   server role = standalone server
   map to guest = Bad User
   guest account = nobody
   smb ports = 445
   load printers = no
   disable spoolss = yes
   log file = /dev/null
[public]
   path = /srv/samba/public
   browsable = yes
   guest ok = yes
   read only = yes
   force user = nobody
