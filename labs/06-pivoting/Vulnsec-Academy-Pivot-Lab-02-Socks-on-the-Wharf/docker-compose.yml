name: vulnsec-pivot-lab02

services:
  foothold:
    build:
      context: ./foothold
    image: vulnsec-pivot-lab02-foothold
    hostname: edge-247
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',22),2); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 6s
    restart: "no"
    networks:
      edge:
        ipv4_address: "10.23.54.247"
      hidden:
        ipv4_address: "10.24.10.2"

  inner:
    build:
      context: ./inner
    image: vulnsec-pivot-lab02-inner
    hostname: wharf-inner
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 4s
    restart: "no"
    networks:
      hidden:
        ipv4_address: "10.24.10.22"

  mission-control:
    build:
      context: ./mission-control
    image: vulnsec-pivot-lab02-mission-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./runtime/lab-state.json:/run/mission-control/lab-state.json:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: "no"
    depends_on:
      foothold:
        condition: service_healthy
      inner:
        condition: service_healthy
    networks:
      - portal

networks:
  edge:
    ipam:
      config:
        - subnet: "10.23.54.0/24"
          gateway: "10.23.54.1"
  hidden:
    internal: true
    ipam:
      config:
        - subnet: "10.24.10.0/24"
  portal:
    driver: bridge
