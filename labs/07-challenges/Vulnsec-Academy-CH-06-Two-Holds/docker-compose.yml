name: vulnsec-ch06

services:
  foothold:
    build: {context: ./foothold}
    image: vulnsec-ch06-foothold
    hostname: jump-172
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    restart: "no"
    networks:
      edge:
        ipv4_address: "10.23.54.172"
      hidden:
        ipv4_address: "10.24.20.2"

  samba:
    build: {context: ./samba}
    image: vulnsec-ch06-samba
    hostname: hold-share
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',445),2); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    restart: "no"
    networks:
      hidden:
        ipv4_address: "10.24.20.10"

  inner:
    build: {context: ./inner}
    image: vulnsec-ch06-inner
    hostname: hold-linux
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',22),2); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 8s
    restart: "no"
    networks:
      hidden:
        ipv4_address: "10.24.20.20"

  decoy:
    build: {context: ./decoy}
    image: vulnsec-ch06-decoy
    hostname: hold-appliance
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 4s
    restart: "no"
    networks:
      hidden:
        ipv4_address: "10.24.20.30"

  mission-control:
    build: {context: ./mission-control}
    image: vulnsec-ch06-mission-control
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8888:8888"]
    volumes:
      - ./runtime/lab-state.json:/run/mission-control/lab-state.json:ro
    tmpfs: ["/tmp:size=8m,mode=1777"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: "no"
    depends_on:
      foothold: {condition: service_healthy}
      samba: {condition: service_healthy}
      inner: {condition: service_healthy}
      decoy: {condition: service_healthy}
    networks: [portal]

networks:
  edge:
    internal: true
    ipam:
      config:
        - subnet: "10.23.54.0/24"
          gateway: "10.23.54.1"
  hidden:
    internal: true
    ipam:
      config:
        - subnet: "10.24.20.0/24"
  portal:
    driver: bridge
