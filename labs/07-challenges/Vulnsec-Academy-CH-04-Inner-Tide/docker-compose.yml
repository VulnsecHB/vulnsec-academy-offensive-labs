name: vulnsec-ch04

services:
  foothold:
    build:
      context: ./foothold
    image: vulnsec-ch04-foothold
    hostname: edge-151
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    restart: "no"
    networks:
      edge:
        ipv4_address: "10.23.54.151"
      hidden:
        ipv4_address: "10.24.10.2"

  inner:
    build:
      context: ./inner
    image: vulnsec-ch04-inner
    hostname: tide-desk
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 6s
    restart: "no"
    networks:
      hidden:
        ipv4_address: "10.24.10.20"

  mission-control:
    build:
      context: ./mission-control
    image: vulnsec-ch04-mission-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./runtime/lab-state.json:/run/mission-control/lab-state.json:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: "no"
    depends_on:
      foothold:
        condition: service_healthy
      inner:
        condition: service_healthy
    networks:
      - portal

networks:
  edge:
    internal: true
    ipam:
      config:
        - subnet: "10.23.54.0/24"
          gateway: "10.23.54.1"
  hidden:
    internal: true
    ipam:
      config:
        - subnet: "10.24.10.0/24"
  portal:
    driver: bridge
