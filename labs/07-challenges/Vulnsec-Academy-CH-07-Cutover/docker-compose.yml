name: vulnsec-ch07

services:
  target:
    build: {context: ./target}
    image: vulnsec-ch07-target
    hostname: cutover
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 12s
    restart: "no"
    cap_add: ["NET_ADMIN"]
    networks:
      edge:
        ipv4_address: "10.23.54.185"
      hidden:
        ipv4_address: "10.24.30.2"

  bonus:
    build: {context: ./bonus}
    image: vulnsec-ch07-bonus
    hostname: spare-hold
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 4s
    restart: "no"
    networks:
      hidden:
        ipv4_address: "10.24.30.5"

  mission-control:
    build: {context: ./mission-control}
    image: vulnsec-ch07-mission-control
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8888:8888"]
    volumes:
      - ./runtime/lab-state.json:/run/mission-control/lab-state.json:ro
    tmpfs: ["/tmp:size=8m,mode=1777"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: "no"
    depends_on:
      target: {condition: service_healthy}
      bonus: {condition: service_healthy}
    networks: [portal]

networks:
  edge:
    internal: true
    ipam:
      config:
        - subnet: "10.23.54.0/24"
          gateway: "10.23.54.1"
  hidden:
    internal: true
    ipam:
      config:
        - subnet: "10.24.30.0/24"
  portal:
    driver: bridge
