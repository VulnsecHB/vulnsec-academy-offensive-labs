[global]
   workgroup = NORTHLINE
   server string = Northline records
   server role = standalone server
   map to guest = Bad User
   guest account = nobody
   disable netbios = no
   smb ports = 445 139
   log file = /dev/null
   logging = syslog@0
   load printers = no
   printcap name = /dev/null
   disable spoolss = yes

[records]
   path = /srv/samba/records
   browsable = yes
   guest ok = yes
   guest only = yes
   read only = yes
   force user = nobody
